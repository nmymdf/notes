name: Build Windows & Android apps

on:
  push:
    branches: ['**']
    tags: ['v*']
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx electron-builder --win --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: |
            dist/DeskNotes.exe
            dist/DeskNotes-Setup.exe

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: 1
      - run: npm run android
      - name: Build APK
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon
      - run: cp android/app/build/outputs/apk/release/app-release.apk DeskNotes.apk
      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: DeskNotes.apk

  # Publish only when both builds succeeded, so the download links always work.
  release:
    needs: [windows, android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Read version
        id: ver
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
      # Permanent direct download links:
      # https://github.com/<owner>/<repo>/releases/latest/download/DeskNotes.exe (.apk)
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.version }}
          name: DeskNotes ${{ steps.ver.outputs.version }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          overwrite_files: true
          body: |
            下載方式：
            - **DeskNotes.exe**：Windows 免安裝版，下載後點兩下就能用
            - **DeskNotes-Setup.exe**：Windows 安裝版，會建立桌面捷徑
            - **DeskNotes.apk**：安卓手機版（需允許「安裝不明來源的應用程式」）

            Windows 第一次執行若出現藍色「Windows 已保護您的電腦」，按「其他資訊」→「仍要執行」。
          files: |
            dist/DeskNotes.exe
            dist/DeskNotes-Setup.exe
            dist/DeskNotes.apk
