name: Build Windows app

on:
  push:
    branches: ['**']
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx electron-builder --win --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: DeskNotes-windows
          path: |
            dist/DeskNotes.exe
            dist/DeskNotes-Setup.exe
      # Publish a release so there is a permanent direct download link:
      # https://github.com/<owner>/<repo>/releases/latest/download/DeskNotes.exe
      - name: Read version
        id: ver
        shell: bash
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.version }}
          name: DeskNotes ${{ steps.ver.outputs.version }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          overwrite_files: true
          body: |
            下載方式（Windows）：
            - **DeskNotes.exe**：免安裝版，下載後點兩下就能用
            - **DeskNotes-Setup.exe**：安裝版，會建立桌面捷徑

            第一次執行若出現藍色「Windows 已保護您的電腦」，按「其他資訊」→「仍要執行」。
          files: |
            dist/DeskNotes.exe
            dist/DeskNotes-Setup.exe
