<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; img-src 'self' note-img: data: blob: https: http:; style-src 'self' 'unsafe-inline'; script-src 'self'">
  <title>DeskNotes  —  designer: ArchieKuo</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <svg xmlns="http://www.w3.org/2000/svg" style="display:none">
    <symbol id="i-menu" viewBox="0 0 24 24"><path d="M3 6h18M3 12h18M3 18h18"/></symbol>
    <symbol id="i-notes" viewBox="0 0 24 24"><rect x="5" y="3" width="14" height="18" rx="2"/><path d="M8 3v18"/></symbol>
    <symbol id="i-star" viewBox="0 0 24 24"><path d="M12 3l2.8 5.7 6.2.9-4.5 4.4 1 6.2L12 17.3 6.5 20.2l1-6.2L3 9.6l6.2-.9z"/></symbol>
    <symbol id="i-trash" viewBox="0 0 24 24"><path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13M10 11v6M14 11v6"/></symbol>
    <symbol id="i-folder" viewBox="0 0 24 24"><path d="M3 6a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></symbol>
    <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
    <symbol id="i-new" viewBox="0 0 24 24"><path d="M20 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h6"/><path d="M17.5 2.5a2.1 2.1 0 0 1 3 3L12 14l-4 1 1-4z"/></symbol>
    <symbol id="i-image" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="M21 15l-5-5L5 21"/></symbol>
    <symbol id="i-check-circle" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M8 12l3 3 5-6"/></symbol>
    <symbol id="i-grid" viewBox="0 0 24 24"><rect x="4" y="4" width="6" height="6" rx="1"/><rect x="14" y="4" width="6" height="6" rx="1"/><rect x="4" y="14" width="6" height="6" rx="1"/><rect x="14" y="14" width="6" height="6" rx="1"/></symbol>
    <symbol id="i-list" viewBox="0 0 24 24"><path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/></symbol>
    <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></symbol>
    <symbol id="i-sort" viewBox="0 0 24 24"><path d="M6 4v16M3 17l3 3 3-3M12 6h9M12 11h7M12 16h5"/></symbol>
    <symbol id="i-down" viewBox="0 0 24 24"><path d="M12 4v16M6 14l6 6 6-6"/></symbol>
    <symbol id="i-up" viewBox="0 0 24 24"><path d="M12 20V4M6 10l6-6 6 6"/></symbol>
    <symbol id="i-back" viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></symbol>
    <symbol id="i-pin" viewBox="0 0 24 24"><path d="M9 4h6l-1 6 4 4H6l4-4zM12 14v7"/></symbol>
    <symbol id="i-export" viewBox="0 0 24 24"><path d="M12 3v12M7 8l5-5 5 5M5 15v4a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-4"/></symbol>
    <symbol id="i-restore" viewBox="0 0 24 24"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/></symbol>
    <symbol id="i-more" viewBox="0 0 24 24"><circle cx="5" cy="12" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/></symbol>
    <symbol id="i-mic" viewBox="0 0 24 24"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></symbol>
    <symbol id="i-lock" viewBox="0 0 24 24"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></symbol>
    <symbol id="i-unlock" viewBox="0 0 24 24"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 7.5-2"/></symbol>
    <symbol id="i-key" viewBox="0 0 24 24"><circle cx="8" cy="15" r="4"/><path d="M11 12l9-9M16 7l3 3M18 5l2 2"/></symbol>
    <symbol id="i-import" viewBox="0 0 24 24"><path d="M12 3v12M7 10l5 5 5-5M5 15v4a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-4"/></symbol>
    <symbol id="i-table" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 9h18M3 14.5h18M9 4v16"/></symbol>
    <symbol id="i-inbox" viewBox="0 0 24 24"><path d="M4 13l2.5-8h11L20 13v6H4z"/><path d="M4 13h5l1 2h4l1-2h5"/></symbol>
    <symbol id="i-move" viewBox="0 0 24 24"><path d="M3 6a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><path d="M10 13h6M13 10l3 3-3 3"/></symbol>
  </svg>

  <div id="drawer-backdrop"></div>
  <div id="app">
    <!-- ================= Sidebar ================= -->
    <aside id="sidebar">
      <button class="icon-btn" id="btn-toggle-sidebar" title="收合側邊欄"><svg><use href="#i-menu"/></svg></button>
      <nav>
        <a class="nav-item" data-view="all"><svg><use href="#i-notes"/></svg><span>所有筆記</span><em id="count-all"></em></a>
        <a class="nav-item" data-view="uncategorized"><svg><use href="#i-inbox"/></svg><span>未分類</span><em id="count-uncat"></em></a>
        <a class="nav-item" data-view="starred"><svg><use href="#i-star"/></svg><span>我的最愛</span><em id="count-starred"></em></a>
        <a class="nav-item" data-view="vault"><svg><use href="#i-lock"/></svg><span>上鎖筆記</span><button class="icon-btn small row-add hidden" id="btn-new-vault-folder" title="新增上鎖資料夾"><svg><use href="#i-plus"/></svg></button><em id="count-vault"></em></a>
        <div id="vault-folder-list" class="hidden"></div>
        <hr>
        <div class="nav-section">
          <span><svg><use href="#i-folder"/></svg>資料夾</span>
          <button class="icon-btn small" id="btn-new-folder" title="新增資料夾"><svg><use href="#i-plus"/></svg></button>
        </div>
        <div id="folder-list"></div>
      </nav>
      <a class="nav-item trash-bottom" data-view="trash"><svg><use href="#i-trash"/></svg><span>垃圾筒</span><em id="count-trash"></em></a>
      <button class="import-btn" id="btn-import-outlook" title="匯入 Outlook 2010 匯出的記事 CSV 檔"><svg><use href="#i-import"/></svg><span>匯入 Outlook 記事…</span></button>
      <button class="import-btn undo hidden" id="btn-undo-import" title="把上次從 Outlook 匯入的筆記全部移到垃圾筒"><svg><use href="#i-trash"/></svg><span></span></button>
      <div class="sidebar-foot">快速筆記：Ctrl + Alt + N</div>
    </aside>

    <!-- ================= List view ================= -->
    <main id="list-view">
      <header class="topbar">
        <button class="icon-btn" id="btn-mobile-menu" title="選單"><svg><use href="#i-menu"/></svg></button>
        <h1 id="view-title">所有筆記</h1>
        <div class="actions" id="normal-actions">
          <button class="text-btn" id="btn-new-note"><svg><use href="#i-new"/></svg>建立筆記</button>
          <button class="text-btn" id="btn-new-voice-note" title="Ctrl+Shift+M"><svg><use href="#i-mic"/></svg>語音筆記</button>
          <button class="text-btn" id="btn-new-image-note"><svg><use href="#i-image"/></svg>匯入圖片</button>
          <button class="text-btn" id="btn-select-mode"><svg><use href="#i-check-circle"/></svg>編輯</button>
          <button class="text-btn" id="btn-view-mode"><svg><use href="#i-grid"/></svg><span>檢視</span></button>
          <button class="icon-btn hidden" id="btn-vault-password" title="變更上鎖筆記密碼"><svg><use href="#i-key"/></svg></button>
          <button class="icon-btn hidden" id="btn-vault-lock" title="立即上鎖"><svg><use href="#i-lock"/></svg></button>
          <button class="text-btn danger hidden" id="btn-empty-trash"><svg><use href="#i-trash"/></svg>清空垃圾筒</button>
        </div>
        <div class="actions hidden" id="select-actions">
          <span id="select-count">已選取 0 則</span>
          <button class="text-btn" id="btn-select-all">全選</button>
          <button class="text-btn" id="btn-sel-color"><i class="dot red"></i>顏色</button>
          <button class="text-btn" id="btn-sel-move"><svg><use href="#i-move"/></svg>移動</button>
          <button class="text-btn" id="btn-sel-vault"><svg><use href="#i-lock"/></svg>上鎖</button>
          <button class="text-btn" id="btn-sel-unvault"><svg><use href="#i-unlock"/></svg>移出上鎖</button>
          <button class="text-btn" id="btn-sel-restore"><svg><use href="#i-restore"/></svg>還原</button>
          <button class="text-btn danger" id="btn-sel-delete"><svg><use href="#i-trash"/></svg>刪除</button>
          <button class="text-btn" id="btn-select-done">完成</button>
        </div>
        <label class="search">
          <input id="search" type="search" placeholder="搜尋" autocomplete="off">
          <svg><use href="#i-search"/></svg>
        </label>
      </header>
      <div class="sortbar">
        <div class="color-filter" id="color-filter">
          <span>顏色</span>
          <button data-cf="" class="on">全部</button>
          <button data-cf="red" title="只看紅色"><i class="dot red"></i></button>
          <button data-cf="yellow" title="只看黃色"><i class="dot yellow"></i></button>
          <button data-cf="green" title="只看綠色"><i class="dot green"></i></button>
          <button data-cf="none" title="只看無色"><i class="dot none"></i></button>
        </div>
        <svg><use href="#i-sort"/></svg>
        <select id="sort-field">
          <option value="updatedAt">修改日期</option>
          <option value="createdAt">建立日期</option>
          <option value="title">標題</option>
        </select>
        <span class="sep">|</span>
        <button class="icon-btn" id="btn-sort-dir" title="排序方向"><svg><use href="#i-down"/></svg></button>
      </div>
      <section id="notes" class="grid"></section>
      <div id="empty" class="empty hidden"></div>
      <form id="vault-gate" class="vault-gate hidden" autocomplete="off">
        <svg class="big"><use href="#i-lock"/></svg>
        <h2 id="vault-gate-title">上鎖筆記</h2>
        <p id="vault-gate-text"></p>
        <input type="password" id="vault-pw" placeholder="密碼">
        <input type="password" id="vault-pw2" placeholder="再輸入一次密碼">
        <div id="vault-gate-error" class="gate-error"></div>
        <button type="submit" class="text-btn primary" id="vault-gate-ok">解鎖</button>
      </form>
    </main>

    <!-- ================= Editor view ================= -->
    <main id="editor-view" class="hidden">
      <header class="editor-top">
        <button class="icon-btn" id="btn-back" title="返回 (Esc)"><svg><use href="#i-back"/></svg></button>
        <input id="note-title" placeholder="標題" maxlength="200">
        <span id="vault-badge" class="vault-badge hidden"><svg><use href="#i-lock"/></svg>已加密</span>
        <span id="save-state"></span>
        <select id="note-folder" title="資料夾"></select>
        <span class="note-colors" id="note-colors" title="筆記顏色">
          <button data-c="" title="無色"><i class="dot none"></i></button>
          <button data-c="red" title="紅"><i class="dot red"></i></button>
          <button data-c="yellow" title="黃"><i class="dot yellow"></i></button>
          <button data-c="green" title="綠"><i class="dot green"></i></button>
        </span>
        <button class="icon-btn" id="btn-star" title="加入我的最愛"><svg><use href="#i-star"/></svg></button>
        <button class="icon-btn" id="btn-on-top" title="視窗置頂"><svg><use href="#i-pin"/></svg></button>
        <button class="icon-btn" id="btn-export" title="匯出成 HTML"><svg><use href="#i-export"/></svg></button>
        <button class="icon-btn" id="btn-delete-note" title="刪除筆記"><svg><use href="#i-trash"/></svg></button>
      </header>
      <div class="toolbar" id="toolbar">
        <button data-cmd="undo" title="復原 (Ctrl+Z)">↶</button>
        <button data-cmd="redo" title="重做 (Ctrl+Y)">↷</button>
        <i></i>
        <button data-block="H1" title="大標題"><b>H1</b></button>
        <button data-block="H2" title="小標題"><b>H2</b></button>
        <button data-block="P" title="內文">¶</button>
        <i></i>
        <button data-cmd="bold" title="粗體 (Ctrl+B)"><b>B</b></button>
        <button data-cmd="italic" title="斜體 (Ctrl+I)"><i class="it">I</i></button>
        <button data-cmd="underline" title="底線 (Ctrl+U)"><u>U</u></button>
        <button data-cmd="strikeThrough" title="刪除線"><s>S</s></button>
        <span class="split">
          <button class="apply" data-color-apply="fore" title="文字顏色（套用目前顏色）"><span class="color-mark" id="mark-fore">A</span></button>
          <button class="arrow" data-color-menu="fore" title="選擇文字顏色">▾</button>
        </span>
        <span class="split">
          <button class="apply" data-color-apply="hilite" title="螢光筆（套用目前顏色）"><span class="color-mark hl" id="mark-hilite">ab</span></button>
          <button class="arrow" data-color-menu="hilite" title="選擇螢光筆顏色">▾</button>
        </span>
        <button data-cmd="removeFormat" title="清除格式">⨯</button>
        <i></i>
        <button data-cmd="insertUnorderedList" title="項目符號">•≡</button>
        <button data-cmd="insertOrderedList" title="編號">1≡</button>
        <button id="btn-checklist" title="待辦清單">☑</button>
        <button data-cmd="outdent" title="減少縮排">⇤</button>
        <button data-cmd="indent" title="增加縮排">⇥</button>
        <i></i>
        <button id="btn-insert-image" title="插入圖片"><svg><use href="#i-image"/></svg></button>
        <button id="btn-insert-hr" title="分隔線">―</button>
        <i></i>
        <button id="btn-voice" class="voice" title="語音輸入 (Ctrl+Shift+M 或 Win+H)"><svg><use href="#i-mic"/></svg><span>語音輸入</span></button>
      </div>
      <div class="editor-scroll">
        <div id="editor" contenteditable="true" spellcheck="false" data-placeholder="開始記事… 可直接 Ctrl+V 貼上截圖或拖曳圖片進來"></div>
      </div>
      <div id="color-palette" class="palette hidden">
        <div class="palette-title"></div>
        <button class="palette-none" data-color="">
          <span class="swatch none"></span><span class="none-label"></span>
        </button>
        <div class="swatches"></div>
        <label class="palette-custom">自訂顏色…<input type="color" id="custom-color"></label>
      </div>
      <div id="img-bar" class="img-bar hidden">
        <button data-w="25">25%</button>
        <button data-w="50">50%</button>
        <button data-w="75">75%</button>
        <button data-w="100">100%</button>
        <button data-w="">原始</button>
        <button data-act="delete" class="danger">刪除</button>
      </div>
    </main>
  </div>

  <!-- ================= Overlays ================= -->
  <div id="modal" class="modal hidden">
    <form class="modal-box" id="modal-form">
      <h3 id="modal-title"></h3>
      <p id="modal-text"></p>
      <input id="modal-input" autocomplete="off">
      <select id="modal-select"></select>
      <div class="modal-actions">
        <button type="button" class="text-btn" id="modal-cancel">取消</button>
        <button type="submit" class="text-btn primary" id="modal-ok">確定</button>
      </div>
    </form>
  </div>
  <div id="import-dialog" class="modal hidden">
    <form class="modal-box wide" id="import-form">
      <h3>匯入 Outlook 記事</h3>
      <p id="import-summary"></p>
      <div class="import-map">
        <label>標題欄位 <select id="import-title"></select></label>
        <label>內容欄位 <select id="import-body"></select></label>
      </div>
      <div class="import-preview-head">預覽（前 5 則）</div>
      <div class="import-preview" id="import-preview"></div>
      <div class="modal-actions">
        <button type="button" class="text-btn" id="import-cancel">取消</button>
        <button type="submit" class="text-btn primary" id="import-ok">匯入</button>
      </div>
    </form>
  </div>
  <div id="context-menu" class="context-menu hidden"></div>
  <div id="lightbox" class="lightbox hidden"><img alt=""></div>
  <div id="toast" class="toast hidden"></div>

  <script src="app.js"></script>
</body>
</html>
